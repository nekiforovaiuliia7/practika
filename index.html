{% extends "base.html" %}

{% block content %}
<div class="header">
    <h1>Менеджер задач</h1>
    <a href="{{ url_for('logout') }}"><button>Выйти</button></a>
</div>

<h2>Добавить новую задачу</h2>
<form method="POST" action="{{ url_for('add_task') }}">
    <div class="form-group">
        <label for="title">Название:</label>
        <input type="text" id="title" name="title" required>
    </div>
    <div class="form-group">
        <label for="description">Описание:</label>
        <textarea id="description" name="description" rows="3"></textarea>
    </div>
    <div class="form-group">
        <label for="due_date">Срок выполнения:</label>
        <input type="date" id="due_date" name="due_date" required>
    </div>
    <button type="submit">Добавить задачу</button>
</form>

<h2>Ваши задачи</h2>
{% for task in tasks %}
    <div class="task {% if task.completed %}completed{% endif %}">
        <form method="POST" action="{{ url_for('edit_task', task_id=task.id) }}" style="display: inline;">
            <div class="form-group">
                <label for="title_{{ task.id }}">Название:</label>
                <input type="text" id="title_{{ task.id }}" name="title" value="{{ task.title }}" required>
            </div>
            <div class="form-group">
                <label for="description_{{ task.id }}">Описание:</label>
                <textarea id="description_{{ task.id }}" name="description" rows="2">{{ task.description }}</textarea>
            </div>
            <div class="form-group">
                <label for="due_date_{{ task.id }}">Срок выполнения:</label>
                <input type="date" id="due_date_{{ task.id }}" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="completed" {% if task.completed %}checked{% endif %}>
                    Выполнено
                </label>
            </div>
            <button type="submit">Обновить</button>
        </form>
        <a href="{{ url_for('delete_task', task_id=task.id) }}" onclick="return confirm('Вы уверены, что хотите удалить эту задачу?')">
            <button style="background-color: #f44336;">Удалить</button>
        </a>
    </div>
{% endfor %}
{% endblock %}
